name: Actualizeaza cursul

on:
  schedule:
    - cron: "0 6,10,13,16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preia cursul
        run: python3 scraper.py
      - name: Salveaza rates.json daca s-a schimbat
        run: |
          git config user.name "curs-bot"
          git config user.email "curs-bot@users.noreply.github.com"
          if ! git diff --quiet -- rates.json; then
            git add rates.json
            git commit -m "curs: actualizare $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Nicio schimbare."
          fi
